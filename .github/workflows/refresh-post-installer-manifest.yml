name: Refresh post-installer-fix manifest

on:
  push:
    branches:
      - release/1.0.0-rc2
    paths:
      - ".github/workflows/refresh-post-installer-manifest.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          package_dirs=("bin","docs","hooks","lib","templates","tests")
          package_files=(".gitignore","CHANGELOG.md","COMMANDS.md","QUICKSTART.md","README.md","SOURCES.md","VERSION","install.sh","uninstall.sh")
          paths=list(package_files)
          for rel in package_files:
              if not Path(rel).is_file(): raise SystemExit(f"missing: {rel}")
          for dirname in package_dirs:
              for p in Path(dirname).rglob("*"):
                  if not p.is_file(): continue
                  if "__pycache__" in p.parts or p.suffix in {".pyc",".pyo"} or ".pytest_cache" in p.parts: continue
                  paths.append(p.as_posix())
          lines=[f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}" for rel in sorted(set(paths))]
          Path("MANIFEST.sha256").write_text("\n".join(lines)+"\n")
          print(f"manifest entries: {len(lines)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          git commit -m "Refresh manifest after installer smoke isolation fix"
          git push origin HEAD:release/1.0.0-rc2
