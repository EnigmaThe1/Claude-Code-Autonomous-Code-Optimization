name: Release candidate qualification

on:
  push:
    branches:
      - "release/**"
    paths:
      - ".release-qualify"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release branch identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          if [[ "$GITHUB_REF_NAME" == release/* ]]; then
            EXPECTED="${GITHUB_REF_NAME#release/}"
            if [[ "$VERSION" != "$EXPECTED" ]]; then
              echo "::error title=Release branch/version mismatch::Branch '$GITHUB_REF_NAME' requires VERSION '$EXPECTED', but VERSION contains '$VERSION'."
              exit 1
            fi
          fi
          test -f .release-qualify || { echo "::error title=Qualification trigger missing::.release-qualify is required for both push and manual qualification."; exit 1; }
          grep -Fxq "version=$VERSION" .release-qualify || { echo "::error title=Qualification trigger/version mismatch::.release-qualify must contain version=$VERSION."; exit 1; }
          EXPECTED_SOURCE="$(git rev-parse HEAD^)"
          grep -Fxq "source_sha=$EXPECTED_SOURCE" .release-qualify || { echo "::error title=Qualification source mismatch::.release-qualify must attest immediate parent $EXPECTED_SOURCE."; exit 1; }
      - name: Install qualification prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap shellcheck unzip
          python -m pip install --disable-pip-version-check pytest pytest-cov ruff
      - name: Source qualification
        env:
          PYTHONPATH: lib
        run: |
          set -euo pipefail
          python scripts/build_manifest.py --check
          sha256sum -c MANIFEST.sha256
          bash -n install.sh
          bash -n uninstall.sh
          bash -n bin/claude-auto
          python -m compileall -q lib hooks tests scripts
          ruff check lib hooks tests scripts --select E9,F63,F7,F82
          shellcheck -x install.sh uninstall.sh bin/claude-auto
          test "$(./bin/claude-auto --version)" = "claude-auto $(cat VERSION)"
          python -m pytest -q
          python -m pytest -q --cov=lib --cov=hooks --cov-report=term
      - name: Build deterministic archive
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, stat, zipfile
          root=Path.cwd(); version=(root/"VERSION").read_text().strip()
          top=f"claude-code-autonomous-code-optimization-{version}"
          out=Path("/tmp")/f"{top}.zip"
          entries=[]
          for line in (root/"MANIFEST.sha256").read_text().splitlines():
              if line.strip():
                  _digest, rel=line.split(None,1); entries.append(rel.strip())
          rels=sorted(set(entries+["MANIFEST.sha256"]))
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
              for rel in rels:
                  p=root/rel
                  info=zipfile.ZipInfo(f"{top}/{rel}",date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3
                  info.external_attr=(stat.S_IFREG|stat.S_IMODE(p.stat().st_mode))<<16
                  zf.writestr(info,p.read_bytes())
          print("sha256="+hashlib.sha256(out.read_bytes()).hexdigest())
          with zipfile.ZipFile(out) as zf:
              for rel in ("bin/claude-auto","install.sh","uninstall.sh"):
                  if ((zf.getinfo(f"{top}/{rel}").external_attr>>16)&0o111)==0:
                      raise SystemExit(f"{rel} lost executable archive mode")
              for rel in ("LICENSE","NOTICE"):
                  zf.getinfo(f"{top}/{rel}")
          Path("/tmp/archive-path").write_text(str(out))
          PY
      - name: Qualify extracted archive
        run: |
          set -euo pipefail
          ZIP="$(cat /tmp/archive-path)"
          rm -rf /tmp/claude-auto-release && mkdir -p /tmp/claude-auto-release
          unzip -q "$ZIP" -d /tmp/claude-auto-release
          PKG="/tmp/claude-auto-release/claude-code-autonomous-code-optimization-$(cat VERSION)"
          cd "$PKG"
          sha256sum -c MANIFEST.sha256
          test -f LICENSE
          test -f NOTICE
          PYTHONPATH=lib python -m pytest -q
      - name: Transactional installer smoke
        run: |
          set -euo pipefail
          ZIP="$(cat /tmp/archive-path)"
          TEST_HOME="$(mktemp -d)"
          rm -rf /tmp/claude-auto-install && mkdir -p /tmp/claude-auto-install
          unzip -q "$ZIP" -d /tmp/claude-auto-install
          PKG="/tmp/claude-auto-install/claude-code-autonomous-code-optimization-$(cat VERSION)"
          export HOME="$TEST_HOME"
          export CLAUDE_AUTONOMY_HOME="$TEST_HOME/.local/share/claude-autonomy"
          export CLAUDE_AUTONOMY_BIN="$TEST_HOME/.local/bin"
          mkdir -p "$CLAUDE_AUTONOMY_BIN"
          cd "$PKG"
          ./install.sh --no-plugins
          test -f "$CLAUDE_AUTONOMY_HOME/LICENSE"
          test -f "$CLAUDE_AUTONOMY_HOME/NOTICE"
          test "$("$CLAUDE_AUTONOMY_BIN/claude-auto" --version)" = "claude-auto $(cat VERSION)"
          "$CLAUDE_AUTONOMY_HOME/uninstall.sh"
      - name: Upload qualified archive
        uses: actions/upload-artifact@v7
        with:
          name: claude-code-autonomous-code-optimization-${{ github.sha }}
          path: /tmp/claude-code-autonomous-code-optimization-*.zip
          if-no-files-found: error
