name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate branch/version identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          EFFECTIVE_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$EFFECTIVE_BRANCH" == release/* ]]; then
            EXPECTED="${EFFECTIVE_BRANCH#release/}"
            if [[ "$VERSION" != "$EXPECTED" ]]; then
              echo "::error title=Release branch/version mismatch::Branch '$EFFECTIVE_BRANCH' requires VERSION '$EXPECTED', but VERSION contains '$VERSION'."
              exit 1
            fi
          fi
      - name: Install test prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap shellcheck
          python -m pip install --disable-pip-version-check pytest pytest-cov ruff
      - name: Public-baseline reference audit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          test_prefix = "test_" + "r" + "c"
          module_prefix = "claude_auto_" + "r" + "c"
          old_repo = "EnigmaThe1/" + "Tem" + "p2"
          old_branch_prefix = "claude/" + "r" + "c"
          pre_public_version = re.compile(r"\b0\.[0-9]+\.[0-9]+-rc[0-9]+\b", re.I)
          historical = re.compile(
              rf"(?:{test_prefix}[0-9]+_|{module_prefix}[0-9]+|{re.escape(old_repo)}|{re.escape(old_branch_prefix)})",
              re.I,
          )
          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if historical.search(path.as_posix()):
                  hits.append(f"path: {path}")
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  if historical.search(line) or pre_public_version.search(line):
                      hits.append(f"{path}:{number}: {line.strip()}")
          if hits:
              raise SystemExit("Historical pre-public release labels detected:\n" + "\n".join(hits))
          PY
      - name: Prepare release-branch development manifest
        if: ${{ startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/') }}
        run: |
          set -euo pipefail
          python scripts/build_manifest.py --write
          if ! git diff --quiet -- MANIFEST.sha256; then
            echo "::notice title=Development manifest refreshed::The committed MANIFEST.sha256 is not release-final for this development SHA. CI regenerated it in the runner so installer regressions can still execute."
          fi
      - name: Verify committed package manifest
        if: ${{ !(startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) }}
        run: |
          set -euo pipefail
          python scripts/build_manifest.py --check
          sha256sum -c MANIFEST.sha256
      - name: Package static checks
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n uninstall.sh
          bash -n bin/claude-auto
          python -m compileall -q lib hooks tests scripts
          ruff check lib hooks tests scripts --select E9,F63,F7,F82
          shellcheck -x install.sh uninstall.sh bin/claude-auto
          test "$(./bin/claude-auto --version)" = "claude-auto $(cat VERSION)"
      - name: Full regression and coverage
        env:
          PYTHONPATH: lib
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m pytest -q --cov=lib --cov=hooks --cov-report=term
      - name: Critical regression groups
        env:
          PYTHONPATH: lib
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_complex_hardening.py
          python -m pytest -q tests/test_environment_blocker_hardening.py
          python -m pytest -q tests/test_environment_resilience.py
          python -m pytest -q tests/test_profile_switch.py
          python -m pytest -q tests/test_user_layer.py
