name: Tag accepted release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Accepted version without the leading v (for example 1.0.0-rc3)"
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  tag:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Validate accepted release identity and create tag
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(cat VERSION)"
          MAIN_SHA="$(git rev-parse HEAD)"
          TAG="v$VERSION"
          RELEASE_BRANCH="release/$VERSION"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            if [[ -z "$WORKFLOW_RUN_SHA" || "$WORKFLOW_RUN_SHA" != "$MAIN_SHA" ]]; then
              echo "::error title=Stale main CI result::Completed CI was for '$WORKFLOW_RUN_SHA' but current main is '$MAIN_SHA'."
              exit 1
            fi
          elif [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != "$VERSION" ]]; then
            echo "::error title=Requested version mismatch::Requested '$REQUESTED_VERSION' but main contains VERSION '$VERSION'."
            exit 1
          fi

          git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          RELEASE_SHA="$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH")"
          if [[ "$RELEASE_SHA" != "$MAIN_SHA" ]]; then
            echo "::error title=Release/main mismatch::main is $MAIN_SHA but $RELEASE_BRANCH is $RELEASE_SHA."
            exit 1
          fi

          if [[ ! -f .release-qualify ]]; then
            echo "::error title=Qualification attestation missing::.release-qualify is required on the accepted SHA."
            exit 1
          fi
          grep -Fxq "version=$VERSION" .release-qualify || {
            echo "::error title=Qualification version mismatch::.release-qualify does not attest $VERSION."
            exit 1
          }
          EXPECTED_SOURCE="$(git rev-parse HEAD^)"
          grep -Fxq "source_sha=$EXPECTED_SOURCE" .release-qualify || {
            echo "::error title=Qualification source mismatch::.release-qualify must attest immediate parent $EXPECTED_SOURCE."
            exit 1
          }

          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/release-candidate.yml/runs"             -f branch="$RELEASE_BRANCH" -f status=success -f per_page=100 > /tmp/release-runs.json
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs"             -f branch="main" -f status=success -f per_page=100 > /tmp/main-ci-runs.json
          MAIN_SHA="$MAIN_SHA" python - <<'PY'
          import json
          import os
          from pathlib import Path

          sha = os.environ["MAIN_SHA"]

          release_data = json.loads(Path("/tmp/release-runs.json").read_text())
          release_matches = [
              run for run in release_data.get("workflow_runs", [])
              if run.get("head_sha") == sha and run.get("conclusion") == "success"
          ]
          if not release_matches:
              raise SystemExit(f"No successful release qualification found for exact SHA {sha}")

          ci_data = json.loads(Path("/tmp/main-ci-runs.json").read_text())
          ci_matches = [
              run for run in ci_data.get("workflow_runs", [])
              if run.get("head_sha") == sha and run.get("conclusion") == "success"
          ]
          if not ci_matches:
              raise SystemExit(f"No successful main CI found for exact SHA {sha}")

          print(f"qualification_run={release_matches[0]['id']}")
          print(f"main_ci_run={ci_matches[0]['id']}")
          PY

          EXISTING="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}' || true)"
          if [[ -n "$EXISTING" ]]; then
            if [[ "$EXISTING" == "$MAIN_SHA" ]]; then
              echo "Tag $TAG already points to accepted SHA $MAIN_SHA; nothing to do."
              exit 0
            fi
            echo "::error title=Release tag conflict::$TAG already exists at $EXISTING; this workflow never moves release tags."
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"             -f ref="refs/tags/$TAG"             -f sha="$MAIN_SHA"
          echo "Created release tag $TAG -> $MAIN_SHA"
