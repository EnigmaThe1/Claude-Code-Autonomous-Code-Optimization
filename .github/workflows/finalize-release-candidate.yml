name: Finalize release candidate

on:
  push:
    branches:
      - "release/**"
    paths:
      - ".release-finalize"

permissions:
  actions: write
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate finalization request
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          EXPECTED="${GITHUB_REF_NAME#release/}"
          if [[ "$VERSION" != "$EXPECTED" ]]; then
            echo "::error title=Release branch/version mismatch::Branch '$GITHUB_REF_NAME' requires VERSION '$EXPECTED', but VERSION contains '$VERSION'."
            exit 1
          fi
          test -f .release-finalize || { echo "::error title=Finalization request missing::.release-finalize is required."; exit 1; }

          mapfile -t FINALIZE_LINES < .release-finalize
          if (( ${#FINALIZE_LINES[@]} != 2 )); then
            echo "::error title=Invalid finalization request::.release-finalize must contain exactly two lines: version and sequence."
            exit 1
          fi
          if [[ "${FINALIZE_LINES[0]}" != "version=$VERSION" ]]; then
            echo "::error title=Finalization request/version mismatch::.release-finalize must start with version=$VERSION."
            exit 1
          fi
          if [[ ! "${FINALIZE_LINES[1]}" =~ ^sequence=([1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid finalization sequence::.release-finalize requires sequence=<positive integer> as its second line."
            exit 1
          fi
          SEQUENCE="${BASH_REMATCH[1]}"

          mapfile -d '' -t REQUEST_PATHS < <(git diff --name-only -z "$GITHUB_SHA^" "$GITHUB_SHA" --)
          if (( ${#REQUEST_PATHS[@]} != 1 )) || [[ "${REQUEST_PATHS[0]}" != ".release-finalize" ]]; then
            printf '::error title=Unsafe finalization request::The request commit must change only .release-finalize; changed paths:'
            printf ' %q' "${REQUEST_PATHS[@]}"
            printf '\n'
            exit 1
          fi

          PARENT_SEQUENCE=0
          if git cat-file -e "$GITHUB_SHA^:.release-finalize" 2>/dev/null; then
            mapfile -t PARENT_LINES < <(git show "$GITHUB_SHA^:.release-finalize")
            if (( ${#PARENT_LINES[@]} != 2 )); then
              echo "::error title=Invalid parent finalization marker::Parent .release-finalize must contain exactly two lines."
              exit 1
            fi
            if [[ ! "${PARENT_LINES[0]}" =~ ^version=.+$ ]]; then
              echo "::error title=Invalid parent finalization marker::Parent .release-finalize has no valid version line."
              exit 1
            fi
            if [[ ! "${PARENT_LINES[1]}" =~ ^sequence=([1-9][0-9]*)$ ]]; then
              echo "::error title=Invalid parent finalization marker::Parent .release-finalize has no valid positive sequence."
              exit 1
            fi
            PARENT_SEQUENCE="${BASH_REMATCH[1]}"
          fi
          if (( SEQUENCE <= PARENT_SEQUENCE )); then
            echo "::error title=Non-monotonic finalization sequence::Requested sequence $SEQUENCE must be greater than parent sequence $PARENT_SEQUENCE."
            exit 1
          fi
      - name: Rebuild final package manifest
        run: |
          set -euo pipefail
          python scripts/build_manifest.py --write
          python scripts/build_manifest.py --check
          sha256sum -c MANIFEST.sha256
      - name: Commit qualification trigger
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          SEQUENCE="$(sed -n 's/^sequence=//p' .release-finalize)"
          cat > .release-qualify <<EOF
          version=$VERSION
          sequence=$SEQUENCE
          source_sha=$GITHUB_SHA
          EOF
          git add MANIFEST.sha256 .release-qualify
          STATUS="$(git status --porcelain)"
          if [[ -z "$STATUS" ]]; then
            echo "::error title=Nothing to finalize::Finalization produced no manifest or qualification-trigger change."
            exit 1
          fi
          BAD="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(MANIFEST\.sha256|\.release-qualify)$' || true)"
          if [[ -n "$BAD" ]]; then
            echo "::error title=Unexpected finalizer mutation::Finalizer may modify only MANIFEST.sha256 and .release-qualify: $BAD"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize $VERSION qualification sequence $SEQUENCE"
          git push --force-with-lease="refs/heads/$GITHUB_REF_NAME:$GITHUB_SHA" origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Dispatch final CI and release qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          if [[ "$REMOTE_SHA" != "$FINAL_SHA" ]]; then
            echo "::error title=Final branch advanced::Expected remote $GITHUB_REF_NAME at $FINAL_SHA, found $REMOTE_SHA."
            exit 1
          fi
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          gh workflow run release-candidate.yml --ref "$GITHUB_REF_NAME"
